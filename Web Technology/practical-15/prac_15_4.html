<html>
<body>

<script>
    let fruits = ["Apple", "Banana", "Mango"];

    document.write("Original: " + fruits + "<br>");

    fruits.push("Orange");
    document.write("Push: " + fruits + "<br>");

    fruits.pop();
    document.write("Pop: " + fruits + "<br>");

    fruits.shift();
    document.write("Shift: " + fruits + "<br>");

    fruits.unshift("Grapes");
    document.write("Unshift: " + fruits + "<br>");

    fruits.splice(1, 1);
    document.write("Splice: " + fruits + "<br>");

    fruits.sort();
    document.write("Sort: " + fruits + "<br>");
</script>

</body>
</html>
