<!-- wap to write fibbonacci series using recursion -->
<html>
    <head></head>
    <body>
        <script>
            function fibonacci(n) {
                if (n <= 1) {
                    return n;
                }
                return fibonacci(n - 1) + fibonacci(n - 2);
            }

            var num = parseInt(prompt("Enter the number of terms for Fibonacci series:"));
            var series = [];

            for (var i = 0; i < num; i++) {
                series.push(fibonacci(i));
            }

            alert("Fibonacci series up to " + num + " terms: " + series.join(", "));
        </script>
    </body>
</html>
