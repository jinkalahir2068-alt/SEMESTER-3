<!DOCTYPE html>
<html>
<head>
    <title>Anchor and Image</title>
</head>
<body>

<h2>Anchor Tag</h2>

<p>Click the link to visit Google:</p>
<a href="https://www.google.com" target="_blank">Visit Google</a>

<hr>

<h2>Image using Local Path</h2>

<img src="images/photo.jpg" alt="Local Image" width="250" height="150">

<hr>

<h2>Image using Online URL</h2>

<img src="https://picsum.photos/250/150" alt="Online Image">

</body>
</html>
