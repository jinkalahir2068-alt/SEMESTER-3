<!DOCTYPE html>
<html>
<head>
    <title>List Controls</title>
</head>
<body>

<h2>Ordered List</h2>

<ol>
    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>
</ol>

<h2>Unordered List</h2>

<ul>
    <li>Apple</li>
    <li>Mango</li>
    <li>Banana</li>
</ul>

<h2>Description List</h2>

<dl>
    <dt>HTML</dt>
    <dd>HyperText Markup Language used to create web pages.</dd>

    <dt>CSS</dt>
    <dd>Cascading Style Sheets used for webpage styling.</dd>
</dl>

</body>
</html>
