<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>COVID-19 Vaccine Registration Form</title>
</head>

<body>

<form>

    <h1 align="center">COVID-19 VACCINE REGISTRATION FORM</h1>

    <table align="center">

        <tr>
            <td><label>First Name</label></td>
            <td>
                <input type="text" placeholder="Enter Your First Name">
            </td>
        </tr>

        <tr>
            <td><label>Last Name</label></td>
            <td>
                <input type="text" placeholder="Enter Your Last Name">
            </td>
        </tr>

        <tr>
            <td><label>Aadhar Number</label></td>
            <td>
                <input type="text" placeholder="Enter Your Aadhar Number">
            </td>
        </tr>

        <tr>
            <td><label>Vaccine Name</label></td>
            <td>
                <select>
                    <option selected disabled>
                        Please Select Your Vaccine Name
                    </option>
                    <option>ABC</option>
                    <option>PWR</option>
                    <option>FD</option>
                    <option>DS</option>
                </select>
            </td>
        </tr>

        <tr>
            <td><label>Vaccination Center Name</label></td>
            <td>
                <select>
                    <option selected disabled>
                        Please Select Vaccination Center Name
                    </option>
                    <option>ABC</option>
                    <option>PWR</option>
                    <option>FD</option>
                    <option>DS</option>
                </select>
            </td>
        </tr>

        <tr>
            <td><label>Date Of Dose</label></td>
            <td>
                <input type="date">
            </td>
        </tr>

        <tr>
            <td><label>Dose Number</label></td>
            <td>
                <input type="number">
            </td>
        </tr>

        <tr>
            <td colspan="2" align="center">
                <button type="submit">Click Here</button>
                <button type="reset">Reset</button>
            </td>
        </tr>

    </table>

</form>

</body>
</html>
