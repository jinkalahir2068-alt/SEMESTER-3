
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Registration Form</title>
</head>

<body>

<form>

    <h1 align="center">Student Registration</h1>

    <table align="center">

        <tr>
            <td><label>Full Name</label></td>
            <td>
                <input type="text" placeholder="Enter Your Full Name">
            </td>
        </tr>

        <tr>
            <td><label>Email</label></td>
            <td>
                <input type="email" placeholder="Enter Your Email">
            </td>
        </tr>

        <tr>
            <td><label>Mobile Number</label></td>
            <td>
                <input type="tel" placeholder="Enter Your Mobile Number">
            </td>
        </tr>

        <tr>
            <td><label>Address</label></td>
            <td>
                <textarea rows="3" cols="21"
                    placeholder="Enter Your Address"></textarea>
            </td>
        </tr>

        <tr>
            <td><label>Nationality</label></td>
            <td>
                <input type="text" placeholder="Enter Your Nationality">
            </td>
        </tr>

        <tr>
            <td><label>Date of Birth</label></td>
            <td>
                <input type="date">
            </td>
        </tr>

        <tr>
            <td><label>Gender</label></td>
            <td>
                <input type="radio" name="gender" value="male"> Male
                <input type="radio" name="gender" value="female"> Female
            </td>
        </tr>

        <tr>
            <td><label>Highest Degree</label></td>
            <td>
                <select>
                    <option selected disabled>Select Your Degree</option>
                    <option>Diploma</option>
                    <option>D2D</option>
                    <option>BTech</option>
                    <option>BTech CSE</option>
                </select>
            </td>
        </tr>

        <tr>
            <td><label>CPI</label></td>
            <td>
                <input type="number" step="0.01"
                    placeholder="Enter Your CPI">
            </td>
        </tr>

        <tr>
            <td><label>University</label></td>
            <td>
                <input type="text" placeholder="Enter Your University">
            </td>
        </tr>

        <tr>
            <td><label>Passing Year</label></td>
            <td>
                <select>
                    <option selected disabled>Select Your Passing Year</option>
                    <option>2025</option>
                    <option>2024</option>
                    <option>2023</option>
                    <option>2022</option>
                </select>
            </td>
        </tr>

        <tr>
            <td colspan="2" align="center">
                <button type="submit">Submit</button>
                <button type="reset">Reset</button>
            </td>
        </tr>

    </table>

</form>

</body>
</html>
