<!-- Create a webpage that shows the use of:
a. Child Selector (ul > li)
b. Adjacent Sibling Selector (h2 + p)
c. Attribute Selector (input[type="text"]) to target specific elements and apply
CSS rules. -->
<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body>

    <h1>CSS Selector Example</h1>

    <h2>Child Selector Example</h2>

    <ul>
        <li>Item 1</li>

        <ul>
            <li>abc</li>
        </ul>

        <li>Item 2</li>
        <li>Item 3</li>
        <li>Item 4</li>
    </ul>

    <h2>Adjacent Sibling Selector</h2>

    <p>This paragraph is styled using the adjacent sibling selector.</p>

    <p>This paragraph is styled using the adjacent sibling selector.</p>

    <h2>Attribute Selector Example</h2>

    <input type="text" placeholder="Enter text here">

</body>
</html>
