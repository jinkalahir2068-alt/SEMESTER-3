<!-- Create an HTML page that applies different styles using basic CSS selectors: element
 selector (p), class selector (.className), and ID selector (#idName). -->
<!DOCTYPE html>
<html>
<head>
    <style>
        p {
            color: blue;
            font-size: 20px;
        }

        .classDemo {
            color: yellow;
            font-weight: bold;
        }

        #idDemo {
            color: deeppink;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>CSS SELECTORS</h1>

    <p>This paragraph is styled with the element selector.</p>

    <p class="classDemo">
        This paragraph is styled with the class selector.
    </p>

    <p id="idDemo">
        This paragraph is styled with the ID selector.
    </p>

</body>
</html>
