<!-- Design a webpage that applies common styles to multiple elements using the group
selector (h1, p), universal selector (*), and descendant selector (div p) -->

<!DOCTYPE html>
<html>

<head>
    <style>

        * {
            font-family: sans-serif;
            font-weight: bold;
        }

        h1, p {
            color: deeppink;
        }

        div p {
            color: darkgreen;
        }

    </style>
</head>

<body>

    <h1>Hello, Welcome back to your web page</h1>

    <p>This is the example of group selector</p>

    <div>
        <p>
            This is the example of descendant selector (div p)
        </p>
    </div>

</body>
</html>
